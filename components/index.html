<!-- @dsCard group="Components" name="Components Index" subtitle="Every component demo in one grid — click a card to open it on its own" viewport="1280x760" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>digidelic — components</title>
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script src="./Emblem/Emblem.js"></script>
<style>
:root{
  --grad-blue-pink: linear-gradient(90deg, #2d6cff 0%, #ff2d87 100%);
  --grad-blue-pink-135: linear-gradient(135deg, #2d6cff 0%, #a82fff 50%, #ff2d87 100%);
}
body{margin:0;background:#050505;color:#fff;font-family:'Geist Mono','Red Hat Mono',monospace;padding:34px 38px 46px;position:relative}
.ambient-ascii{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url('../assets/tex-ascii-dense.png');
  background-size:480px;background-repeat:repeat;
  mix-blend-mode:hard-light;opacity:0.055;
  filter:contrast(180%) brightness(120%);
}
.page-content{position:relative;z-index:1}
a{color:#00d9ff;transition:color 100ms ease}
a:hover{color:#ff2d87}
h1{font-family:'Space Grotesk',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;font-size:34px;margin:0 0 6px}
h1 em{font-style:normal;background:var(--grad-blue-pink);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:rgba(255,255,255,.55);font-size:12px;line-height:1.6;max-width:64ch;margin:0 0 24px}
.chk{
  height:7px;background-color:#ff6050;
  background-image:linear-gradient(45deg,#2d6cff 25%,transparent 25%,transparent 75%,#2d6cff 75%),
                   linear-gradient(45deg,#2d6cff 25%,transparent 25%,transparent 75%,#2d6cff 75%);
  background-size:14px 14px;background-position:0 0,7px 7px;margin:0 0 0
}
.chk-accent{height:2px;background:var(--grad-blue-pink);margin:0 0 24px}
.p{font-size:11px;line-height:1.7;margin:0 0 12px;opacity:.72}
.exports{font-size:9.5px;letter-spacing:.05em;color:rgba(255,255,255,.4);margin:0}
.exports b{color:rgba(255,255,255,.7);font-weight:400}
.go{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#2d6cff;font-weight:700;margin-top:auto;padding-top:6px;transition:color 100ms ease}
.dd-card-int:hover .go{color:#ff2d87}
.dd-card-int:hover{box-shadow:0 8px 24px rgba(0,0,0,0.8), 0 0 0 1px rgba(45,108,255,0.3)}
code{color:#00d9ff}
::selection{background:#ff2d87;color:#000}
</style>
</head>
<body>
<div class="ambient-ascii" aria-hidden="true"></div>
<div class="page-content">
<div class="chk"></div>
<div class="chk-accent"></div>
<h1>Components <em>// Spec</em></h1>
<p class="sub">Seven source files, twenty-five exports. Each card opens that component's own demo page — every variant, surface and state, standalone.</p>
<div id="root"></div>
</div>
<script>
const { CardGrid, Card } = window.DigidelicDesignSystem_da5439;
const { createElement: h, Fragment } = React;

const COMPONENTS = [
  { slug: 'Badge', blurb: 'Fixed-meaning status chips and seeded label chips — three surfaces.', exports: ['Badge', 'BadgeCount', 'BadgeRow'] },
  { slug: 'Emblem', blurb: 'Vector cosmogram rosettes, planetary armillaries, clovers, starbursts & stepped code emblems.', exports: ['Emblem', 'EmblemBadge', 'EmblemCluster', 'EmblemGrid'] },
  { slug: 'Button', blurb: 'Seeded hue, four variants, flat texture and stepped motion — black, night and cream.', exports: ['Button', 'ButtonRow'] },
  { slug: 'Card', blurb: 'Panel, raised, flat, accent and outline grounds — with checker trim and flat texture.', exports: ['Card', 'CardSection', 'CardGrid'] },
  { slug: 'Field', blurb: 'Inputs, selects, checkboxes — seeded focus ring, validation, three surfaces.', exports: ['Field', 'Input', 'Select', 'Checkbox'] },
  { slug: 'NodeCard', blurb: 'The signature form — node panels, sector roll-ups, stat tiles, ASCII meters.', exports: ['NodeCard', 'SectorCard', 'StatCard', 'NodeMeter'] },
  { slug: 'Progress', blurb: 'Solid bars, discrete segments, stacked breakdowns, ASCII meters and stepped spinners.', exports: ['Progress', 'ProgressSegments', 'ProgressStack', 'ProgressAscii', 'Spinner'] },
];

function open(slug) { location.href = `./${slug}/${slug}.html`; }

function Demo() {
  return h(CardGrid, { min: 260 },
    ...COMPONENTS.map(c => h(Card, {
      key: c.slug, id: c.slug, label: 'component', title: c.slug,
      interactive: true, strip: true,
      onClick: () => open(c.slug),
      style: { minHeight: 168 },
    },
      h('p', { className: 'p' }, c.blurb),
      h('p', { className: 'exports' }, c.exports.map((e, i) => h(Fragment, { key: e }, i > 0 ? ' · ' : '', h('b', null, e)))),
      h('div', { className: 'go' }, `view ${c.slug} →`)
    ))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
<script src="/nav-node.js" defer></script>
</body>
</html>
