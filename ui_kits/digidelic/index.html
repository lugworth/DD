<style>

/* ── TEXTURE OVERLAY LAYERS ── */

/* ── SWIRL / SPIRAL PATTERNS ── */

/* concentric repeating-radial swirl, drawn with conic+radial mix */

  -webkit-mask:radial-gradient(circle at 50% 50%, #000 60%, transparent 72%);
          mask:radial-gradient(circle at 50% 50%, #000 60%, transparent 72%);

}
/* true spiral via conic gradient pinwheel */
.pinwheel{

            currentColor 30deg 38deg, transparent 38deg 60deg,

/* ── PSYCHEDELIA (restrained · brand palette only · no hue-shift) ── */
/* single-color soft swirl — color set per instance via currentColor */
.swirl{
  position:absolute; pointer-events:none; border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%, transparent 0 7px, currentColor 7px 7.6px, transparent 7.6px 15px);
  -webkit-mask:radial-gradient(circle at 50% 50%, #000 56%, transparent 72%);

}
.pinwheel{
  position:absolute; pointer-events:none; border-radius:50%;

/* chromatic-aberration pulse for headers (brand pink + cyan) */

/* soft single-color aura streak — color set per instance, stays blurred */
@keyframes aura-drift{ 0%,100%{transform:translateX(-50%) skewX(-8deg) scaleY(1)} 33%{transform:translateX(-46%) skewX(6deg) scaleY(1.06)} 66%{transform:translateX(-54%) skewX(-10deg) scaleY(.97)} }

  position:absolute; top:-12%; left:50%; width:30%; height:124%;

<body>
<div id="root"></div>
<!-- psychedelic liquid-warp filter -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="psyGoo">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="3" seed="7" result="noise">
        <animate attributeName="baseFrequency" dur="14s" values="0.008 0.014;0.018 0.006;0.008 0.014" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" dur="9s" values="22;46;22" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
    <filter id="psyWave">
      <feTurbulence type="turbulence" baseFrequency="0.002 0.02" numOctaves="3" seed="3" result="w">
        <animate attributeName="baseFrequency" dur="9s" values="0.002 0.02;0.008 0.05;0.002 0.02" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="70" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" dur="7s" values="40;88;40" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
    <filter id="psyWaveXL">
      <feTurbulence type="turbulence" baseFrequency="0.0015 0.012" numOctaves="2" seed="9" result="wx">
        <animate attributeName="baseFrequency" dur="13s" values="0.0015 0.012;0.005 0.03;0.0015 0.012" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="wx" scale="120" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" dur="10s" values="70;150;70" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
  </defs>
</svg>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── RESPONSIVE HOOK ───────────────────────────────────────────────
function useIsMobile(bp=720) {
  const [m, setM] = useState(typeof window!=='undefined' && window.innerWidth < bp);
  useEffect(()=>{
    const on = ()=>setM(window.innerWidth < bp);
    window.addEventListener('resize', on);
    return ()=>window.removeEventListener('resize', on);
  },[bp]);
  return m;
}

// ── TOKENS ────────────────────────────────────────────────────────
const C = {
  void:    '#000000',
  base:    '#0a0a0a',
  surface: '#111110',
  raised:  '#1a1a18',
  overlay: '#252521',
  border:  'rgba(255,255,255,0.12)',
  borderMid: 'rgba(255,255,255,0.18)',
  borderHi:  'rgba(255,255,255,0.25)',
  fg1:  '#ffffff',
  fg2:  'rgba(255,255,255,0.86)',
  fg3:  'rgba(255,255,255,0.55)',
  fg4:  'rgba(255,255,255,0.42)',
  cobalt: '#2d6cff',
  cobaltDim: '#1f52d6',
  pink:   '#ff2d87',
  pinkDim:'#ff0066',
  green:  '#39ff6a',
  lime:   '#c6ff3a',
  limeDim:'#a0e600',
  orange: '#ff5a00',
  cyan:   '#00d9ff',
  red:    '#ff6050',
  coral:  '#ff6050',
  blue:   '#2d6cff',
  sky:    '#0a84e0',
  teal:   '#12b39b',
  magenta: '#c800ff',
};

// ── DATA ──────────────────────────────────────────────────────────
const SECTORS = [
  { id:'A1',  label:'Sector A1',  nodes:12 },
  { id:'B6',  label:'Sector B6',  nodes:8  },
  { id:'X06', label:'Sector X06', nodes:5  },
  { id:'D9',  label:'Sector D9',  nodes:9  },
  { id:'4R',  label:'Sector 4R',  nodes:3  },
];
const CLASSES  = ['RELAY','TERMINAL','BEACON','VECTOR','SENTINEL','BRIDGE'];
const STATUSES = [
  { id:'nominal',  label:'NOMINAL',  color:C.green,  bg:'rgba(57,255,106,.08)' },
  { id:'running',  label:'RUNNING',  color:C.cobalt, bg:'rgba(45,108,255,.08)'  },
  { id:'scanning', label:'SCANNING', color:C.cyan,   bg:'rgba(0,217,255,.07)'  },
  { id:'warning',  label:'WARNING',  color:C.orange, bg:'rgba(255,90,0,.1)'    },
  { id:'critical', label:'CRITICAL', color:C.pinkDim,bg:'rgba(255,0,102,.09)'  },
  { id:'offline',  label:'OFFLINE',  color:C.fg4,    bg:'transparent'          },
];

function seededRng(seed) {
  let s = seed;
  return () => { s=(s*1664525+1013904223)&0xffffffff; return (s>>>0)/4294967296; };
}
const rng = seededRng(0xD161DE);
function pickStatus() {
  const w=[38,18,14,12,8,10]; let r=rng()*100,c=0;
  for(let i=0;i<STATUSES.length;i++){c+=w[i];if(r<c)return STATUSES[i];}
  return STATUSES[0];
}
const ALL_NODES = [];
let ni=1;
for(const sec of SECTORS) {
  for(let i=0;i<sec.nodes;i++){
    const id=String(ni).padStart(3,'0'), st=pickStatus();
    const h=Math.floor(rng()*1200), m=Math.floor(rng()*60), s2=Math.floor(rng()*60);
    ALL_NODES.push({
      id, num:ni, sector:sec.id,
      class: CLASSES[Math.floor(rng()*CLASSES.length)],
      status: st,
      uptime: st.id==='offline'?'000:00:00':`${String(h).padStart(3,'0')}:${String(m).padStart(2,'0')}:${String(s2).padStart(2,'0')}`,
      signal: st.id==='offline'?0:Math.floor(rng()*100),
      load:   st.id==='offline'?0:Math.floor(rng()*100),
      loc:`${(rng()*90-45).toFixed(1)}N`,
      hex:`0x${Math.floor(rng()*0xFFFF).toString(16).toUpperCase().padStart(4,'0')}`,
    });
    ni++;
  }
}

// ── SHARED COMPONENTS ─────────────────────────────────────────────

function Badge({status, size='sm'}) {
  const h = size==='sm' ? 16 : 20, fs = size==='sm' ? 8 : 9;
  return (
    <div style={{
      display:'inline-flex', alignItems:'center', gap:4,
      height:h, padding:'0 6px', border:`1px solid ${status.color}`,
      background:status.bg, fontSize:fs, letterSpacing:'0.14em',
      textTransform:'uppercase', color:status.color, fontWeight:700, flexShrink:0,
    }}>
      <div style={{width:4,height:4,background:status.color}}/>
      {status.label}
    </div>
  );
}

function Bar({val, color=C.cobalt, height=4, width=60}) {
  return (
    <div style={{height, width, background:C.border, flexShrink:0}}>
      <div style={{height:'100%', width:`${val}%`, background:color, transition:'width 300ms'}}/>
    </div>
  );
}

// ── TOP BAR ───────────────────────────────────────────────────────
function TopBar({activeSector, sysTime, view, setView, mobile, onMenu}) {
  const counts = {
    ok:   ALL_NODES.filter(n=>n.status.id==='nominal').length,
    warn: ALL_NODES.filter(n=>['warning','running'].includes(n.status.id)).length,
    err:  ALL_NODES.filter(n=>n.status.id==='critical').length,
    dead: ALL_NODES.filter(n=>n.status.id==='offline').length,
  };
  return (
    <div style={{
      height: mobile?52:40, background:C.base, borderBottom:`1px solid ${C.border}`,
      display:'flex', alignItems:'center', padding: mobile?'0 8px':'0 14px', gap:0, flexShrink:0,
    }}>
      {mobile && (
        <div onClick={onMenu} aria-label="menu" style={{
          width:44, height:44, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
          gap:4, cursor:'pointer', flexShrink:0, marginRight:2,
        }}>
          <div style={{width:18,height:2,background:C.cobalt}}/>
          <div style={{width:18,height:2,background:C.cobalt}}/>
          <div style={{width:18,height:2,background:C.cobalt}}/>
        </div>
      )}
      {/* Wordmark — monogram lockup (canonical logo) */}
      <div className="wordmark" style={{display:'flex', alignItems:'center', gap:8, marginRight: mobile?'auto':20, flexShrink:0}}>
        <div style={{width:mobile?26:28, height:mobile?26:28, background:C.cobalt, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'Space Grotesk', sans-serif", fontWeight:900, fontSize:mobile?18:20, color:'#000', flexShrink:0}}>d</div>

// ── TERMINAL ──────────────────────────────────────────────────────
const BOOT = [
  {t:0,   text:'SYS_INIT — build 0x0044', c:C.fg4},
  {t:200, text:'loading sector map... ████████ done', c:C.fg4},
  {t:500, text:'▶ session authenticated [LOC: 44.2N]', c:C.lime},
  {t:800, text:`scanning ${ALL_NODES.length} nodes across ${SECTORS.length} sectors`, c:C.cyan},
  {t:1100,text:`▶ WARNING: ${ALL_NODES.filter(n=>n.status.id==='critical').length} nodes critical`, c:C.orange},
  {t:1400,text:'nominal — awaiting input', c:C.fg1},
];

function TerminalPanel({selectedNode}) {
  const [lines, setLines] = useState([]);
  const [input, setInput] = useState('');
  const [hist, setHist] = useState([]), [hi, setHi] = useState(-1);
  const endRef = useRef();

  useEffect(()=>{
    const ts = BOOT.map(l=>setTimeout(()=>setLines(p=>[...p,{text:l.text,c:l.c}]),l.t));
    return ()=>ts.forEach(clearTimeout);
  },[]);

  useEffect(()=>{
    if(selectedNode) setLines(p=>[...p,
      {text:`>> inspect node-${selectedNode.id}`, c:C.cobalt},
      {text:`${selectedNode.class} | ${selectedNode.sector} | ${selectedNode.status.label}`, c:selectedNode.status.color},
      {text:`uptime:${selectedNode.uptime} signal:${selectedNode.signal}% load:${selectedNode.load}%`, c:C.fg2},
    ]);
  },[selectedNode]);

  useEffect(()=>{ endRef.current?.scrollIntoView({block:'end'}); },[lines]);

  function run(cmd) {
    const c=cmd.trim().toLowerCase();
    setLines(p=>[...p,{text:`$ ${cmd}`,c:C.fg1}]);
    setHist(h=>[cmd,...h]); setHi(-1);
    if(!c) return;
    if(c==='help') setLines(p=>[...p,{text:'help | clear | status | nodes | ping [id]',c:C.fg4}]);
    else if(c==='clear') setLines([]);
    else if(c==='status') setLines(p=>[...p,{text:`total:${ALL_NODES.length} ok:${ALL_NODES.filter(n=>n.status.id==='nominal').length} err:${ALL_NODES.filter(n=>n.status.id==='critical').length}`,c:C.fg2}]);
    else if(c==='nodes') setLines(p=>[...p,...ALL_NODES.slice(0,6).map(n=>({text:`node-${n.id} [${n.sector}] ${n.status.label}`,c:n.status.color})),{text:`...+${ALL_NODES.length-6} more`,c:C.fg4}]);
    else if(c.startsWith('ping')) {
      const id=c.split(' ')[1]; const n=ALL_NODES.find(x=>x.id===String(parseInt(id)||0).padStart(3,'0'));
      setLines(p=>[...p, n ? {text:`▶ node-${n.id} ${n.signal>0?`${Math.floor(Math.random()*80+10)}ms`:'TIMEOUT'}`,c:n.signal>0?C.lime:C.red} : {text:'ERR: node not found',c:C.red}]);
    }
    else setLines(p=>[...p,{text:`ERR_UNKNOWN: ${cmd}`,c:C.red}]);
  }

  function onKeyDown(e) {
    if(e.key==='Enter'){run(input);setInput('');}
    else if(e.key==='ArrowUp'){const i=Math.min(hi+1,hist.length-1);setHi(i);setInput(hist[i]||'');e.preventDefault();}
    else if(e.key==='ArrowDown'){const i=Math.max(hi-1,-1);setHi(i);setInput(i>=0?hist[i]:'');e.preventDefault();}
  }

  return (
    <div className="tex-host" style={{height:150, background:'#090908', borderTop:`1px solid ${C.border}`, display:'flex', flexDirection:'column', flexShrink:0, overflow:'hidden'}}>
      <div className="tex tex-ascii-dense" style={{opacity:.1}}/>
      <div className="log-chev">{'<>'.repeat(60)}</div>
      <div style={{position:'relative', zIndex:1, flex:1, overflowY:'auto', padding:'5px 10px', display:'flex', flexDirection:'column', gap:1}}>
        {lines.map((l,i)=><div key={i} style={{fontSize:10, color:l.c, lineHeight:1.5, letterSpacing:'0.03em', display:'flex', gap:6}}><span style={{fontWeight:700, opacity:.7}}>[{String(i).padStart(2,'0')}]</span><span>{l.text}</span></div>)}
        <div ref={endRef}/>
      </div>
      <div className="term-row" style={{position:'relative', zIndex:1, display:'flex', alignItems:'center', padding:'0 10px', height:26, borderTop:`1px solid ${C.void}`, gap:5}}>
        <span style={{fontSize:10, color:C.cobalt, flexShrink:0}}>$</span>
        <input className="term-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={onKeyDown}
          style={{flex:1,background:'transparent',border:'none',outline:'none',fontFamily:"'Geist Mono','Geist Mono','Red Hat Mono',monospace",fontSize:10,color:C.fg1,letterSpacing:'0.04em'}}
          placeholder="enter command..." autoComplete="off" spellCheck={false}/>
        <div style={{width:7,height:11,background:C.fg1,animation:'blink 1s steps(1) infinite',flexShrink:0}}/>
      </div>
    </div>
  );
}

function SectorsView() {
  // rotating duotone accents so healthy sectors still read as a varied color-block grid
  const calmRotation = [C.teal, C.sky, C.green, C.cobalt, C.cyan];
  return (
    <div className="view-fade" style={{flex:1, overflowY:'auto', padding:16, display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))', gap:12, alignContent:'start'}}>
      {SECTORS.map((sec,i)=>{
        const nodes = ALL_NODES.filter(n=>n.sector===sec.id);
        const byStatus = STATUSES.map(s=>({...s, count:nodes.filter(n=>n.status.id===s.id).length})).filter(s=>s.count>0);
        const hasCrit = nodes.some(n=>n.status.id==='critical');
        const hasWarn = nodes.some(n=>n.status.id==='warning');
        // POSITIVE: troubled sectors become loud solid blocks; calm sectors carry a duotone header
        const headColor = hasCrit ? C.red : hasWarn ? C.orange : calmRotation[i % calmRotation.length];
        return (
          <div key={sec.id} className="sector-card" style={{background:C.void, border:`1px solid ${headColor}`, overflow:'hidden'}}>
            {/* SOLID COLOR HEADER BLOCK */}
            <div style={{background:headColor, padding:'10px 12px', display:'flex', justifyContent:'space-between', alignItems:'flex-end'}}>
              <div style={{fontFamily:"'Space Grotesk', sans-serif", fontWeight:900, fontSize:30, lineHeight:.85, letterSpacing:'-0.02em', color:'#000'}}>{sec.id}</div>
              <div style={{textAlign:'right'}}>
                <div style={{fontFamily:"'Space Grotesk', sans-serif", fontWeight:900, fontSize:20, lineHeight:1, color:'#000'}}>{nodes.length}</div>
                <div style={{fontSize:7, color:'rgba(0,0,0,.6)', textTransform:'uppercase', letterSpacing:'0.18em'}}>nodes</div>
              </div>
            </div>
            {/* SEGMENTED STATUS RIBBON — data rendered AS color blocks */}
            <div style={{padding:'8px 12px', display:'flex', flexDirection:'column', gap:4}}>
              {byStatus.map(s=>(
                <div key={s.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                  <span style={{fontSize:8, color:C.fg4, letterSpacing:'0.12em'}}>{s.label}</span>
                  <span style={{fontSize:9, color:s.color, fontWeight:700}}>{s.count}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

  const [mode, setMode] = useState('ALL');
  const [hoverSpec, setHoverSpec] = useState(null);
  const [hoverWave, setHoverWave] = useState(null);
  const [peakFreq, setPeakFreq] = useState('4.32');
  const [braille, setBraille] = useState('⠁⠃⠇⡇⡧⡷⣷⣿⣷⡷⡇⠇⠃⠁');
  const [fluxLoad, setFluxLoad] = useState(78.4);
  const [trajectory, setTrajectory] = useState({ angle: 142.8, r: 0.74 });
  const [wavePhase, setWavePhase] = useState(0);
  const canvasRef = useRef(null);

  // Procedural Web Audio synthesizer
  const playSfx = (type) => {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      if (type === 'anomaly') {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(560, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(65, ctx.currentTime + 0.28);
        g.gain.setValueAtTime(0.18, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } else if (type === 'resync') {
        [440, 660, 880].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.04);
          g.gain.setValueAtTime(0.08, ctx.currentTime + idx * 0.04);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.04 + 0.18);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.04);
          osc.stop(ctx.currentTime + idx * 0.04 + 0.2);
        });
      }
    } catch(e) {}
  };

  const triggerAnomaly = () => {
    setAnomaly(1);
    playSfx('anomaly');
    setTimeout(() => setAnomaly(0), 1400);
  };

  const resync = () => {
    setAnomaly(0);
    playSfx('resync');
  };

  // Quantum Braille ticker & flux simulation
  useEffect(() => {
    const chars = ['⠁','⠃','⠇','⡇','⡧','⡷','⣷','⣿','⣏','⡛','⠵'];
    const t = setInterval(() => {
      let b = '';
      for (let i = 0; i < 20; i++) b += chars[Math.floor(Math.random() * chars.length)];
      setBraille(b);
      setFluxLoad(prev => +(72 + Math.random() * 16 + (anomaly ? 20 : 0)).toFixed(1));
    }, 120);
    return () => clearInterval(t);
  }, [anomaly]);

  // Orbit trajectory simulation
  useEffect(() => {
    let t = 0;
    const interval = setInterval(() => {
      t += 0.06;
      const deg = ((t * 1.8 * 180 / Math.PI) % 360 + 360) % 360;
      const r = +(0.45 + Math.sin(t * 2.2) * 0.32 + (anomaly ? 0.2 : 0)).toFixed(2);
      setTrajectory({ angle: +deg.toFixed(1), r: Math.min(0.95, r) });
      setWavePhase(prev => (prev + 0.12) % (Math.PI * 2));
    }, 50);
    return () => clearInterval(interval);
  }, [anomaly]);

  // Real-time Waterfall Spectrogram Canvas
  useEffect(() => {
    const cvs = canvasRef.current;
    if (!cvs) return;
    const ctx = cvs.getContext('2d');
    const w = cvs.width;
    const h = cvs.height;
    const bins = 48;
    const history = [];
    const colors = [
      [8, 8, 8],
      [45, 108, 255],  // cobalt
      [0, 217, 255],   // cyan
      [57, 255, 106],  // green
      [198, 255, 58],  // lime
      [255, 90, 0],    // orange
      [255, 96, 80],   // coral
      [255, 45, 135],  // pink
      [210, 0, 255]    // magenta
    ];
    let time = 0;
    let req;

    function loop() {
      time += 0.08;
      const frame = new Float32Array(bins);
      let maxV = 0, maxB = 0;
      for (let i = 0; i < bins; i++) {
        const nx = i / bins;
        const carrier1 = Math.exp(-Math.pow((nx - 0.38 - Math.sin(time * 0.4) * 0.2) * 16, 2));
        const carrier2 = Math.exp(-Math.pow((nx - 0.72 + Math.cos(time * 0.3) * 0.15) * 20, 2)) * 0.7;
        const harm = Math.sin(nx * 18 + time) * 0.15;
        const noise = (Math.random() - 0.5) * 0.14 + (anomaly ? (Math.random() * 0.6) : 0);
        const val = Math.max(0, Math.min(1, carrier1 + carrier2 + harm + noise));
        frame[i] = val;
        if (val > maxV) { maxV = val; maxB = i; }
      }
      history.unshift(frame);
      if (history.length > h) history.pop();

      const img = ctx.createImageData(w, h);
      const d = img.data;
      for (let y = 0; y < history.length; y++) {
        const row = history[y];
        for (let x = 0; x < w; x++) {
          const b = Math.floor((x / w) * bins);
          const val = row[b] || 0;
          let rgb = colors[0];
          if (val > 0.05) {
            const cIdx = Math.min(colors.length - 1, Math.floor(val * colors.length));
            rgb = colors[cIdx];
          }
          const px = (y * w + x) * 4;
          d[px] = rgb[0]; d[px+1] = rgb[1]; d[px+2] = rgb[2]; d[px+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);

      // Grid rules
      ctx.strokeStyle = 'rgba(255,255,255,0.09)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 1; i < 6; i++) {
        ctx.moveTo((w / 6) * i, 0); ctx.lineTo((w / 6) * i, h);
      }
      for (let j = 1; j < 4; j++) {
        ctx.moveTo(0, (h / 4) * j); ctx.lineTo(w, (h / 4) * j);
      }
      ctx.stroke();

      if (Math.random() > 0.82) {
        setPeakFreq(((maxB / bins) * 12.8 + 0.2).toFixed(2));
      }

      req = requestAnimationFrame(loop);
    }
    loop();
    return () => cancelAnimationFrame(req);
  }, [anomaly]);

  // CosmoRadar 8 axes data
  const radarAxes = [
    { label: 'LATENCY', code: 'LAT', base: 0.65, val: anomaly ? 0.95 : 0.68 },
    { label: 'QUORUM', code: 'QRM', base: 0.88, val: anomaly ? 0.35 : 0.92 },
    { label: 'ENTROPY', code: 'ENT', base: 0.42, val: anomaly ? 0.98 : 0.44 },
    { label: 'BANDWIDTH', code: 'BW', base: 0.78, val: anomaly ? 0.50 : 0.82 },
    { label: 'JITTER', code: 'JIT', base: 0.25, val: anomaly ? 0.92 : 0.28 },
    { label: 'PARITY', code: 'PAR', base: 0.94, val: anomaly ? 0.40 : 0.96 },
    { label: 'FLUX', code: 'FLX', base: 0.70, val: anomaly ? 0.88 : 0.74 },
    { label: 'VOLTAGE', code: 'VLT', base: 0.82, val: anomaly ? 0.60 : 0.85 },
  ];

  const radarR = 110;
  const radarCenter = { x: 150, y: 150 };

  const getDecagonPoints = (radius) => {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const angle = (i * 36 - 90) * (Math.PI / 180);
      pts.push(`${radarCenter.x + radius * Math.cos(angle)},${radarCenter.y + radius * Math.sin(angle)}`);
    }
    return pts.join(' ');
  };

  const radarDataPoly = radarAxes.map((ax, idx) => {
    const angle = (idx * 45 - 90) * (Math.PI / 180);
    const r = ax.val * radarR;
    return `${radarCenter.x + r * Math.cos(angle)},${radarCenter.y + r * Math.sin(angle)}`;
  }).join(' ');

  const radarShadowPoly = radarAxes.map((ax, idx) => {
    const angle = (idx * 45 - 90) * (Math.PI / 180);
    const r = (ax.val * 0.85) * radarR;
    return `${radarCenter.x + r * Math.cos(angle)},${radarCenter.y + r * Math.sin(angle)}`;
  }).join(' ');

  const trajRad = (trajectory.angle - 90) * (Math.PI / 180);
  const trajX = radarCenter.x + trajectory.r * radarR * Math.cos(trajRad);
  const trajY = radarCenter.y + trajectory.r * radarR * Math.sin(trajRad);

  // Braided wave calculations
  const waveW = 380;
  const waveH = 140;
  const steps = 36;
  const stepW = waveW / steps;
  let chAPts = '';
  let chBPts = '';
  const chAPolygonPts = [];

  for (let i = 0; i <= steps; i++) {
    const x = i * stepW;
    const t = (i / steps) * Math.PI * 4 + wavePhase;
    const yA = waveH * 0.5 - Math.sin(t) * 42 - Math.cos(t * 2) * 14 + (anomaly ? (Math.random() - 0.5) * 35 : 0);
    const yB = waveH * 0.5 + Math.cos(t * 1.2) * 36 + Math.sin(t * 0.7) * 16 + (anomaly ? (Math.random() - 0.5) * 40 : 0);
    const prevX = (i - 1) * stepW;
    if (i === 0) {
      chAPts += `M ${x} ${yA}`;
      chBPts += `M ${x} ${yB}`;
      chAPolygonPts.push(`${x},${yA}`);
    } else {
      chAPts += ` H ${x} V ${yA}`;
      chBPts += ` H ${x} V ${yB}`;
      chAPolygonPts.push(`${x},${yA}`);
    }
  }

  const chAPolyString = `0,${waveH} ` + chAPolygonPts.join(' ') + ` ${waveW},${waveH}`;

  // Treemap partitions
  const partitions = [
    { label: 'NEURAL WEIGHTS', size: '4.18 GB', pct: 42, color: C.cobalt, status: 'LOCKED' },
    { label: 'TELEMETRY BUF', size: '2.40 GB', pct: 24, color: C.lime, status: 'STREAMING' },
    { label: 'FRAME PARITY', size: '1.60 GB', pct: 16, color: C.red, status: 'PARITY_OK' },
    { label: 'PACKET QUORUM', size: '1.00 GB', pct: 10, color: C.orange, status: 'NOMINAL' },
    { label: 'CRYPTO ROOT', size: '0.80 GB', pct: 8, color: C.pink, status: 'SYNCED' },
  ];

  return (
    <div style={{display:'flex', flexDirection:'column', height:'100%', background:C.void, color:C.fg1, overflowY:'auto'}}>
      {/* Top Telemetry HUD Subheader */}
      <div style={{
        padding:'8px 14px', borderBottom:`1px solid ${C.border}`, display:'flex', flexWrap:'wrap',
        alignItems:'center', justifyContent:'space-between', gap:12, background:C.base, flexShrink:0
      }}>
        <div style={{display:'flex', alignItems:'center', gap:10}}>
          <div style={{width:8, height:8, background:anomaly ? C.red : C.cyan, boxShadow:anomaly ? `0 0 8px ${C.red}` : 'none'}}/>
          <span style={{fontSize:10, fontWeight:700, letterSpacing:'0.2em', textTransform:'uppercase', color:C.fg1}}>
            TELEMETRY MESH // SECTOR: {sector}
          </span>
          <span style={{fontSize:9, color:C.fg4, letterSpacing:'0.12em'}}>
            [NODE CLUSTER 0x4F3A]
          </span>
        </div>

        {/* Global Live Readouts */}
        <div style={{display:'flex', alignItems:'center', gap:16, fontSize:9, letterSpacing:'0.12em', fontVariantNumeric:'tabular-nums'}}>
          <div style={{display:'flex', gap:4}}>
            <span style={{color:C.fg4}}>ENTROPY:</span>
            <span style={{color:anomaly ? C.red : C.lime, fontWeight:700}}>{anomaly ? '0.984' : '0.412'}</span>
          </div>
          <div style={{display:'flex', gap:4}}>
            <span style={{color:C.fg4}}>THROUGHPUT:</span>
            <span style={{color:C.cyan, fontWeight:700}}>{fluxLoad} GB/S</span>
          </div>
          <div style={{display:'flex', gap:4}}>
            <span style={{color:C.fg4}}>CRC:</span>
            <span style={{color:anomaly ? C.red : C.green, fontWeight:700}}>{anomaly ? '0xDEAD' : '0xFA91'}</span>
          </div>
        </div>

        {/* HUD Controls */}
        <div style={{display:'flex', alignItems:'center', gap:8}}>
          <button onClick={triggerAnomaly} style={{
            height:26, padding:'0 10px', background:anomaly ? C.red : C.surface, color:anomaly ? '#000' : C.red,
            border:`1px solid ${C.red}`, fontSize:8, fontWeight:700, letterSpacing:'0.16em', textTransform:'uppercase',
            cursor:'pointer'
          }}>
            ⚡ INJECT ANOMALY
          </button>
          <button onClick={resync} style={{
            height:26, padding:'0 10px', background:C.surface, color:C.cyan,
            border:`1px solid ${C.border}`, fontSize:8, fontWeight:700, letterSpacing:'0.16em', textTransform:'uppercase',
            cursor:'pointer'
          }}>
            ▶ RESYNC MESH
          </button>
          <div style={{display:'flex', border:`1px solid ${C.border}`}}>
            {[['ALL','ALL'],['RF','SPEC'],['RADAR','RADAR'],['WAVE','WAVE']].map(([lbl, id]) => (
              <div key={id} onClick={() => setMode(id)} style={{
                height:24, padding:'0 8px', display:'flex', alignItems:'center', fontSize:8,
                letterSpacing:'0.14em', textTransform:'uppercase', cursor:'pointer',
                background: mode === id ? C.cobalt : 'transparent',
                color: mode === id ? '#fff' : C.fg4,
              }}>{lbl}</div>
            ))}
          </div>
        </div>
      </div>

      {/* Main Grid View */}
      <div style={{
        flex:1, padding:14, display:'grid',
        gridTemplateColumns: mode === 'ALL' ? 'repeat(auto-fit, minmax(360px, 1fr))' : '1fr',
        gap:12, alignContent:'start'
      }}>

        {/* PANEL 01: WATERFALL SPECTROGRAM */}
        {(mode === 'ALL' || mode === 'SPEC') && (
          <div style={{background:C.base, border:`1px solid ${C.border}`, padding:12, display:'flex', flexDirection:'column'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
              <div>
                <div style={{fontSize:9, color:C.fg4, letterSpacing:'0.18em', textTransform:'uppercase'}}>0x01 // LIVE RF SPECTRUM</div>
                <div style={{fontSize:11, color:C.fg1, fontWeight:700, letterSpacing:'0.1em'}}>WATERFALL SPECTROGRAM</div>
              </div>
              <div style={{display:'flex', alignItems:'center', gap:8}}>
                <div style={{padding:'2px 6px', background:'#000', border:`1px solid ${C.lime}`, fontSize:8, color:C.lime, fontWeight:700}}>
                  PEAK: {peakFreq} kHz
                </div>
                {hoverSpec && (
                  <div style={{padding:'2px 6px', background:C.cobalt, fontSize:8, color:'#fff', fontWeight:700}}>
                    PROBE: {hoverSpec.freq} kHz · {hoverSpec.db} dBm
                  </div>
                )}
              </div>
            </div>

            {/* Spectrogram Canvas with Hover Tracking */}
            <div style={{position:'relative', width:'100%', height:200, background:'#000', border:`1px solid ${C.border}`, overflow:'hidden'}}
              onMouseMove={(e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const freq = ((x / rect.width) * 12.8 + 0.1).toFixed(2);
                const db = (-(Math.random() * 20 + 20)).toFixed(1);
                setHoverSpec({ freq, db, x });
              }}
              onMouseLeave={() => setHoverSpec(null)}
            >
              <canvas ref={canvasRef} width={400} height={200} style={{width:'100%', height:'100%', display:'block'}}/>
              {hoverSpec && (
                <div style={{position:'absolute', top:0, bottom:0, left:hoverSpec.x, width:1, background:C.cyan, pointerEvents:'none'}}/>
              )}
            </div>

            {/* Frequency Axis Labels */}
            <div style={{display:'flex', justifyContent:'space-between', marginTop:6, fontSize:8, color:C.fg4, letterSpacing:'0.1em'}}>
              <span>0.10 kHz</span>
              <span>3.20 kHz</span>
              <span>6.40 kHz</span>
              <span>9.60 kHz</span>
              <span>12.80 kHz</span>
            </div>
          </div>
        )}

        {/* PANEL 02: COSMORADAR PHASE CONSTELLATION */}
        {(mode === 'ALL' || mode === 'RADAR') && (
          <div style={{background:C.base, border:`1px solid ${C.border}`, padding:12, display:'flex', flexDirection:'column'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
              <div>
                <div style={{fontSize:9, color:C.fg4, letterSpacing:'0.18em', textTransform:'uppercase'}}>0x02 // PHASE CONSTELLATION</div>
                <div style={{fontSize:11, color:C.fg1, fontWeight:700, letterSpacing:'0.1em'}}>COSMORADAR 8-VECTOR MESH</div>
              </div>
              <div style={{fontSize:8, color:C.cyan, letterSpacing:'0.12em', padding:'2px 6px', background:'#000', border:`1px solid ${C.cyan}`}}>
                TRAJECTORY: LOCKED · {trajectory.angle}°
              </div>
            </div>

            <div style={{position:'relative', display:'flex', justifyContent:'center', alignItems:'center', height:220, background:'#000', border:`1px solid ${C.border}`}}>
              <svg width="300" height="220" viewBox="0 0 300 220" style={{overflow:'visible'}}>
                {/* Concentric decagon rings */}
                {[0.25, 0.5, 0.75, 1.0].map((frac, i) => (
                  <polygon key={i} points={getDecagonPoints(frac * radarR)}
                    fill="none" stroke={C.border} strokeWidth="1" strokeDasharray={i === 3 ? "none" : "2,2"}/>
                ))}

                {/* Concentric ring hex labels */}
                <text x={radarCenter.x + 4} y={radarCenter.y - radarR * 0.25} fill={C.fg4} fontSize="6" fontFamily="monospace">0x40</text>
                <text x={radarCenter.x + 4} y={radarCenter.y - radarR * 0.5} fill={C.fg4} fontSize="6" fontFamily="monospace">0x80</text>
                <text x={radarCenter.x + 4} y={radarCenter.y - radarR * 0.75} fill={C.fg4} fontSize="6" fontFamily="monospace">0xC0</text>
                <text x={radarCenter.x + 4} y={radarCenter.y - radarR} fill={C.fg4} fontSize="6" fontFamily="monospace">0xFF</text>

                {/* 8 Vector Spokes */}
                {radarAxes.map((ax, idx) => {
                  const angle = (idx * 45 - 90) * (Math.PI / 180);
                  const x2 = radarCenter.x + radarR * Math.cos(angle);
                  const y2 = radarCenter.y + radarR * Math.sin(angle);
                  const lx = radarCenter.x + (radarR + 14) * Math.cos(angle);
                  const ly = radarCenter.y + (radarR + 14) * Math.sin(angle);
                  return (
                    <g key={ax.code}>
                      <line x1={radarCenter.x} y1={radarCenter.y} x2={x2} y2={y2} stroke="rgba(255,255,255,0.14)" strokeWidth="1"/>
                      <text x={lx} y={ly + 3} fill={C.fg3} fontSize="7" textAnchor="middle" fontFamily="monospace" letterSpacing="0.08em">{ax.code}</text>
                    </g>
                  );
                })}

                {/* Pink shadow polygon */}
                <polygon points={radarShadowPoly} fill="rgba(255,45,135,0.08)" stroke={C.pink} strokeWidth="1" strokeDasharray="3,3"/>

                {/* Cyan active polygon */}
                <polygon points={radarDataPoly} fill="rgba(0,217,255,0.18)" stroke={C.cyan} strokeWidth="1.5"/>

                {/* Center crosshair */}
                <line x1={radarCenter.x - 6} y1={radarCenter.y} x2={radarCenter.x + 6} y2={radarCenter.y} stroke="#fff" strokeWidth="1"/>
                <line x1={radarCenter.x} y1={radarCenter.y - 6} x2={radarCenter.x} y2={radarCenter.y + 6} stroke="#fff" strokeWidth="1"/>

                {/* Orbiting trajectory point */}
                <circle cx={trajX} cy={trajY} r="4" fill={C.red}/>
                <circle cx={trajX} cy={trajY} r="8" fill="none" stroke={C.red} strokeWidth="1" strokeDasharray="2,2"/>
                <line x1={radarCenter.x} y1={radarCenter.y} x2={trajX} y2={trajY} stroke={C.red} strokeWidth="1" strokeDasharray="1,2" opacity="0.6"/>
              </svg>
            </div>

            <div style={{display:'flex', justifyContent:'space-between', marginTop:6, fontSize:8, color:C.fg4, letterSpacing:'0.1em'}}>
              <span>CONSTELLATION: 8-VEC</span>
              <span>POLAR ORBIT: r={trajectory.r}</span>
              <span>STATUS: SYNCHRONIZED</span>
            </div>
          </div>
        )}

        {/* PANEL 03: BRAIDED HORIZON OSCILLOSCOPE */}
        {(mode === 'ALL' || mode === 'WAVE') && (
          <div style={{background:C.base, border:`1px solid ${C.border}`, padding:12, display:'flex', flexDirection:'column'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
              <div>
                <div style={{fontSize:9, color:C.fg4, letterSpacing:'0.18em', textTransform:'uppercase'}}>0x03 // STEPPED DIFFERENTIAL</div>
                <div style={{fontSize:11, color:C.fg1, fontWeight:700, letterSpacing:'0.1em'}}>BRAIDED HORIZON OSCILLOSCOPE</div>
              </div>
              <div style={{display:'flex', gap:8}}>
                <div style={{fontSize:8, color:C.cyan, padding:'2px 6px', background:'#000', border:`1px solid ${C.cyan}`}}>CH-A: 64.2%</div>
                <div style={{fontSize:8, color:C.pink, padding:'2px 6px', background:'#000', border:`1px solid ${C.pink}`}}>CH-B: 35.8%</div>
              </div>
            </div>

            <div style={{position:'relative', width:'100%', height:200, background:'#000', border:`1px solid ${C.border}`, overflow:'hidden'}}
              onMouseMove={(e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const pct = (x / rect.width) * 100;
                setHoverWave({ x, pct: pct.toFixed(1) });
              }}
              onMouseLeave={() => setHoverWave(null)}
            >
              <svg width="100%" height="100%" viewBox={`0 0 ${waveW} ${waveH}`} preserveAspectRatio="none" style={{display:'block'}}>
                <defs>
                  <pattern id="diagHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(0,217,255,0.18)" strokeWidth="1.5" />
                  </pattern>
                </defs>

                {/* Grid guidelines */}
                {[0.25, 0.5, 0.75].map((g, i) => (
                  <line key={i} x1="0" y1={waveH * g} x2={waveW} y2={waveH * g} stroke="rgba(255,255,255,0.06)" strokeWidth="1"/>
                ))}

                {/* Limit gate threshold line */}
                <line x1="0" y1={waveH * 0.18} x2={waveW} y2={waveH * 0.18} stroke={C.red} strokeWidth="1" strokeDasharray="3,3"/>
                <text x="6" y={waveH * 0.18 - 4} fill={C.red} fontSize="6" fontFamily="monospace">LIMIT GATE: 82%</text>

                {/* Hatch infill for Channel A */}
                <polygon points={chAPolyString} fill="url(#diagHatch)" />

                {/* Wave traces */}
                <path d={chAPts} fill="none" stroke={C.cyan} strokeWidth="1.5"/>
                <path d={chBPts} fill="none" stroke={C.pink} strokeWidth="1.2" strokeDasharray="2,2"/>
              </svg>

              {/* Cursor inspector */}
              {hoverWave && (
                <div style={{position:'absolute', top:0, bottom:0, left:hoverWave.x, width:1, background:'#fff', pointerEvents:'none'}}>
                  <div style={{position:'absolute', top:4, left:4, background:'#000', border:`1px solid ${C.border}`, padding:'2px 4px', fontSize:8, color:'#fff', whiteSpace:'nowrap'}}>
                    INDEX: {hoverWave.pct}% · Δ +14.2%
                  </div>
                </div>
              )}
            </div>

            <div style={{display:'flex', justifyContent:'space-between', marginTop:6, fontSize:8, color:C.fg4, letterSpacing:'0.1em'}}>
              <span>TIMEBASE: 250 µs/DIV</span>
              <span>SAMPLING: 96 kS/s</span>
              <span>TRIGGER: AUTO (EDGE)</span>
            </div>
          </div>
        )}

        {/* PANEL 04: SECTOR CAPACITY ALLOCATION TREEMAP */}
        <div style={{background:C.base, border:`1px solid ${C.border}`, padding:12, display:'flex', flexDirection:'column'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
            <div>
              <div style={{fontSize:9, color:C.fg4, letterSpacing:'0.18em', textTransform:'uppercase'}}>0x04 // MEMORY PARTITION MESH</div>
              <div style={{fontSize:11, color:C.fg1, fontWeight:700, letterSpacing:'0.1em'}}>SECTOR ALLOCATION TREEMAP</div>
            </div>
            <div style={{fontSize:8, color:C.green, padding:'2px 6px', background:'#000', border:`1px solid ${C.green}`}}>
              ALLOCATED: 9.98 / 10.00 GB
            </div>
          </div>

          {/* Treemap Blocks */}
          <div style={{display:'flex', flexDirection:'column', gap:4, height:200}}>
            {/* Top row */}
            <div style={{flex:2, display:'flex', gap:4}}>
              <div style={{flex:42, background:C.cobalt, padding:8, display:'flex', flexDirection:'column', justifyContent:'space-between', color:'#fff', border:`1px solid ${C.border}`}}>
                <div style={{fontSize:9, fontWeight:700, letterSpacing:'0.1em'}}>NEURAL WEIGHTS</div>
                <div style={{fontSize:8, opacity:0.8}}>4.18 GB · [LOCKED]</div>
              </div>
              <div style={{flex:24, background:C.lime, padding:8, display:'flex', flexDirection:'column', justifyContent:'space-between', color:'#000', border:`1px solid ${C.border}`}}>
                <div style={{fontSize:9, fontWeight:700, letterSpacing:'0.1em'}}>TELEMETRY BUF</div>
                <div style={{fontSize:8, fontWeight:700}}>2.40 GB · [STREAMING]</div>
              </div>
            </div>

            {/* Bottom row */}
            <div style={{flex:1, display:'flex', gap:4}}>
              <div style={{flex:16, background:C.red, padding:6, display:'flex', flexDirection:'column', justifyContent:'space-between', color:'#fff', border:`1px solid ${C.border}`}}>
                <div style={{fontSize:8, fontWeight:700, letterSpacing:'0.08em'}}>PARITY</div>
                <div style={{fontSize:7, opacity:0.9}}>1.60 GB</div>
              </div>
              <div style={{flex:10, background:C.orange, padding:6, display:'flex', flexDirection:'column', justifyContent:'space-between', color:'#000', border:`1px solid ${C.border}`}}>
                <div style={{fontSize:8, fontWeight:700, letterSpacing:'0.08em'}}>QUORUM</div>
                <div style={{fontSize:7, fontWeight:700}}>1.00 GB</div>
              </div>
              <div style={{flex:8, background:C.pink, padding:6, display:'flex', flexDirection:'column', justifyContent:'space-between', color:'#fff', border:`1px solid ${C.border}`}}>
                <div style={{fontSize:8, fontWeight:700, letterSpacing:'0.08em'}}>CRYPTO</div>
                <div style={{fontSize:7, opacity:0.9}}>0.80 GB</div>
              </div>
            </div>
          </div>

          <div style={{display:'flex', justifyContent:'space-between', marginTop:6, fontSize:8, color:C.fg4, letterSpacing:'0.1em'}}>
            <span>PAGING: 64k PAGES</span>
            <span>VIRTUAL ADDRESS: 0x7FFF_FFFF</span>
            <span>SHARD CODES: NOMINAL</span>
          </div>
        </div>

      </div>

      {/* Bottom Telemetry Bus Bar */}
      <div style={{
        padding:'6px 14px', borderTop:`1px solid ${C.border}`, background:C.base,
        display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0, fontSize:9, letterSpacing:'0.14em'
      }}>
        <div style={{display:'flex', alignItems:'center', gap:12}}>
          <span style={{color:C.fg4}}>QUANTUM STREAM:</span>
          <span style={{color:C.cyan, letterSpacing:'0.2em', fontFamily:'monospace'}}>{braille}</span>
        </div>
        <div style={{display:'flex', alignItems:'center', gap:16, color:C.fg4}}>
          <span>BUS VOLTAGE: <strong style={{color:C.fg1}}>1.18V</strong></span>
          <span>UPTIME: <strong style={{color:C.fg1}}>847h 23m 11s</strong></span>
          <span>REG_0x00: <strong style={{color:C.lime}}>0x98A1 (SYNC)</strong></span>
        </div>
      </div>
    </div>
  );
}

function App() {
  const mobile = useIsMobile();
  const [sector, setSector] = useState('ALL');
  const [selected, setSelected] = useState(null);
  const [view, setView] = useState('grid');
  const [statusFilter, setStatusFilter] = useState(null);
  const [sysTime, setSysTime] = useState('847:23:11');
  const [drawer, setDrawer] = useState(false);

  useEffect(()=>{
    let s=847*3600+23*60+11;
    const t=setInterval(()=>{
      s++;
      const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
      setSysTime(`${String(h).padStart(3,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`);
    },1000);
    return()=>clearInterval(t);
  },[]);

  const bySector = sector==='ALL' ? ALL_NODES : ALL_NODES.filter(n=>n.sector===sector);
  const visibleNodes = statusFilter ? bySector.filter(n=>n.status.id===statusFilter) : bySector;

  return (
    <div style={{height:'100%', display:'flex', flexDirection:'column'}}>
      {/* Brand accent strip — coral × sky checker (zine motif) */}
      <div style={{
        height:12, flexShrink:0,
        backgroundColor:C.coral,
        backgroundImage:`linear-gradient(45deg, ${C.sky} 25%, transparent 25%, transparent 75%, ${C.sky} 75%), linear-gradient(45deg, ${C.sky} 25%, transparent 25%, transparent 75%, ${C.sky} 75%)`,
        backgroundSize:'12px 12px', backgroundPosition:'0 0, 6px 6px',
      }}/>
      <TopBar activeSector={sector} sysTime={sysTime} view={view} setView={setView} mobile={mobile} onMenu={()=>setDrawer(true)}/>
      <div style={{flex:1, display:'flex', overflow:'hidden'}}>
        {mobile
          ? (drawer && <SideNav mobile activeSector={sector} setActiveSector={s=>{setSector(s);setSelected(null);setStatusFilter(null);setDrawer(false);}} onClose={()=>setDrawer(false)}/>)
          : <SideNav activeSector={sector} setActiveSector={s=>{setSector(s);setSelected(null);setStatusFilter(null);}}/>
        }

        {/* Main area */}
        <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden', position:'relative'}}>
          {/* subtle swirl field behind content — brand colors, no hue-shift */}
          <div className="swirl-field" aria-hidden="true">
            <span className="tex tex-ascii-dense" style={{opacity:.14, position:'absolute'}}/>
          </div>
          {view==='sectors' ? <div style={{flex:1, display:'flex', position:'relative', zIndex:1, overflow:'hidden'}}><SectorsView/></div> : view==='viz' ? (
            <div className="view-fade" style={{flex:1, display:'flex', position:'relative', zIndex:1, overflow:'hidden'}}>
              <TelemetryVizView sector={sector}/>
            </div>
          ) : view==='term' ? (
            <div className="view-fade" style={{flex:1, overflowY:'auto', padding:16, position:'relative', zIndex:1}}>
              <div style={{fontSize:10, color:C.fg4, textTransform:'uppercase', letterSpacing:'0.2em', marginBottom:8}}>// FULL TERMINAL</div>
              <TerminalPanel selectedNode={selected}/>
            </div>
          ) : (
            <>
              {/* Grid header — functional status filter */}
              <div style={{padding:'5px 12px', borderBottom:`1px solid ${C.border}`, display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0, position:'relative', zIndex:1, background:C.base}}>
                <span onClick={()=>setStatusFilter(null)} style={{fontSize:8, color:statusFilter?C.cobalt:C.fg4, textTransform:'uppercase', letterSpacing:'0.18em', cursor:statusFilter?'pointer':'default', transition:'color 100ms linear'}}>
                  // {visibleNodes.length} NODES{statusFilter?`  ·  ${statusFilter} ✕`:''}
                </span>
                <div style={{display:'flex', gap:11, alignItems:'center'}}>
                  {[['nominal',C.lime],['running',C.cobalt],['warning',C.orange],['critical',C.red],['offline',C.fg4]].map(([id,c])=>{
                    const on = statusFilter===id;
                    return <div key={id} className="filter-dot" title={id} onClick={()=>setStatusFilter(on?null:id)}
                      style={{width:7,height:7,background:c, opacity:on?1:0.5, transform:on?'scale(1.5)':'none', boxShadow:on?`0 0 0 1px ${c}`:'none'}}/>;
                  })}
                </div>
              </div>
              {/* Grid */}
              <div className="view-fade" style={{flex:1, overflowY:'auto', padding:mobile?10:14, display:'grid', gridTemplateColumns: mobile?'1fr':'repeat(auto-fill,minmax(200px,1fr))', gap:mobile?8:10, alignContent:'start', position:'relative', zIndex:1}}>
                {visibleNodes.length===0 ? (
                  <div style={{gridColumn:'1/-1', padding:'40px 0', textAlign:'center', fontSize:10, color:C.fg4, textTransform:'uppercase', letterSpacing:'0.2em'}}>
                    — no nodes match <span style={{color:C.cobalt}}>{statusFilter}</span> —
                  </div>
                ) : visibleNodes.map(n=>(
                  <NodeCard key={n.id} node={n}
                    selected={selected?.id===n.id}
                    onClick={()=>setSelected(p=>p?.id===n.id?null:n)}/>
                ))}
              </div>
              <div style={{position:'relative', zIndex:1}}><TerminalPanel selectedNode={selected}/></div>
            </>
          )}
        </div>

        <DetailPanel node={selected} onClose={()=>setSelected(null)} mobile={mobile}/>
      </div>

      {/* Mobile bottom tab bar */}
      {mobile && (
        <div style={{display:'flex', flexShrink:0, background:C.base, borderTop:`1px solid ${C.border}`}}>
          {[['GRID','grid','■'],['TERMINAL','term','▶'],['SECTORS','sectors','▦'],['VIZ','viz','◈']].map(([label,id,gly])=>{
            const on = view===id;
            return (
              <div key={id} onClick={()=>setView(id)} style={{
                flex:1, height:54, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:3,
                color: on?C.green:C.fg4, borderRight:`1px solid ${C.void}`, cursor:'pointer',
                borderTop: on?`2px solid ${C.green}`:'2px solid transparent',
              }}>
                <span style={{fontSize:15, lineHeight:1}}>{gly}</span>
                <span style={{fontSize:8, letterSpacing:'0.14em', textTransform:'uppercase'}}>{label}</span>
              </div>
            );
          })}
        </div>
      )}

      {/* Ticker footer — sky strip */}
      <div style={{
        height:22, flexShrink:0, background:C.sky, color:'#fff',
        display:'flex', alignItems:'center', overflow:'hidden', whiteSpace:'nowrap',
        fontSize:10, letterSpacing:'0.14em', textTransform:'lowercase',
      }}>
        <div style={{display:'inline-block', animation:'ticker-run 24s linear infinite', textShadow:'0 1px 3px rgba(0,0,0,.5)'}}>
          {'::/// digidelic sys:0x4f3a /// session authenticated /// 847 nodes online /// june 2nd 2026 '.repeat(2)}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
  <script src="/nav-node.js" defer></script>
</body>
</html>
