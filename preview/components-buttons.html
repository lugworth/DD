<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Solid, ghost, sizes, states — with tweaks" viewport="760x560" -->
<html><head><meta charset="UTF-8"><style>
@font-face{font-family:'Geist Mono';src:url('../fonts/GeistMono-VariableFont_wght.ttf') format('truetype-variations');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Red Hat Mono';src:url('../fonts/RedHatMono-VariableFont_wght.ttf') format('truetype-variations');font-weight:300 700;font-style:normal;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;padding:16px;font-family:'Geist Mono','Geist Mono','Red Hat Mono',monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.label{font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(255,255,255,0.55);width:100%;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:'Geist Mono','Geist Mono','Red Hat Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;padding:0 14px;height:32px;border:none;cursor:pointer;white-space:nowrap;color:#000;transition:border-radius .25s ease,clip-path .25s ease,transform .1s cubic-bezier(.16,1,.3,1),box-shadow .1s cubic-bezier(.16,1,.3,1)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 0 rgba(255,255,255,.3)}
.btn:active{transform:translate(0,0);box-shadow:none}
.pri{background:#2d6cff;color:#000;border:1px solid #2d6cff}
.pink{background:#ff2d87;color:#000;border:1px solid #ff2d87}
.green{background:#39ff6a;color:#000;border:1px solid #39ff6a}
.cyan{background:#00d9ff;color:#000;border:1px solid #00d9ff}
.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.25)}
.ghost-y{background:transparent;color:#2d6cff;border:1px solid #2d6cff}
.ghost-p{background:transparent;color:#ff2d87;border:1px solid #ff2d87}
.danger{background:#ff0066;color:#fff;border:1px solid #ff0066}
.sm{height:22px;font-size:9px;padding:0 10px}
.lg{height:44px;font-size:13px;padding:0 20px}
.icon{width:32px;height:32px;padding:0;justify-content:center;font-size:14px}
.pip{width:6px;height:6px;background:currentColor}
.dis{opacity:0.3;cursor:not-allowed}
.chk{background-color:#ff6050;background-image:linear-gradient(45deg,#2d6cff 25%,transparent 25%,transparent 75%,#2d6cff 75%),linear-gradient(45deg,#2d6cff 25%,transparent 25%,transparent 75%,#2d6cff 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.chk-strip{flex-basis:100%;grid-column:1/-1;height:7px;width:100%;margin-bottom:14px;background-color:#ff6050;background-image:linear-gradient(45deg,#2d6cff 25%,transparent 25%,transparent 75%,#2d6cff 75%),linear-gradient(45deg,#2d6cff 25%,transparent 25%,transparent 75%,#2d6cff 75%);background-size:14px 14px;background-position:0 0,7px 7px}
</style><link rel="stylesheet" href="../glitch.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../tweaks-panel.jsx"></script>
</head><body class="gl-stage">
<div id="root"></div>
<script type="text/babel">
const TWEAK_DEFAULTS = {
  signal: 'live',
  geometry: 'sharp',
  glitch: 'off'
};

const GEOMETRY_STYLE = {
  sharp: {},
  notched: { clipPath: 'polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)' },
  pill: { borderRadius: '999px' }
};

function signalFilter(signal) {
  if (signal === 'standby') return 'grayscale(0.55) sepia(0.35) saturate(2.2) brightness(0.85)';
  if (signal === 'offline') return 'grayscale(1) brightness(0.6) contrast(0.8)';
  return 'none';
}

function Btn({ className, style, children, tweaks }) {
  const glitchProps = {};
  let extraStyle = {};
  if (tweaks.glitch === 'subtle') {
    className += ' gl-text';
  } else if (tweaks.glitch === 'heavy') {
    className += ' gl-text gl-rgb gl-slice';
    glitchProps['data-gl-tear'] = '1';
    glitchProps['data-text'] = typeof children === 'string' ? children : undefined;
  }
  return (
    <button
      className={className}
      style={{ ...GEOMETRY_STYLE[tweaks.geometry], filter: signalFilter(tweaks.signal), ...style, ...extraStyle }}
      {...glitchProps}
    >
      {children}
    </button>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <React.Fragment>
      <div className="chk-strip"></div>
      <div className="label">// PRIMARY / SOLID</div>
      <div className="row">
        <Btn className="btn pri" tweaks={t}><span className="pip"></span>INITIALIZE</Btn>
        <Btn className="btn pink" tweaks={t}><span className="pip"></span>NOTIFY</Btn>
        <Btn className="btn green" tweaks={t}><span className="pip"></span>LIVE</Btn>
        <Btn className="btn cyan" tweaks={t}>DATA</Btn>
        <Btn className="btn danger" tweaks={t}>ABORT</Btn>
      </div>
      <div className="label">// GHOST / OUTLINE</div>
      <div className="row">
        <Btn className="btn ghost" tweaks={t}>INSPECT</Btn>
        <Btn className="btn ghost-y" tweaks={t}><span className="pip"></span>RUN</Btn>
        <Btn className="btn ghost-p" tweaks={t}>SIGNAL</Btn>
      </div>
      <div className="label">// SIZES</div>
      <div className="row">
        <Btn className="btn pri sm" tweaks={t}>SMALL</Btn>
        <Btn className="btn pri" tweaks={t}>DEFAULT</Btn>
        <Btn className="btn pri lg" tweaks={t}><span className="pip"></span>LARGE CTA</Btn>
      </div>
      <div className="label">// ICON + DISABLED</div>
      <div className="row">
        <Btn className="btn ghost-y icon" tweaks={t}>▶</Btn>
        <Btn className="btn ghost icon" tweaks={t}>■</Btn>
        <Btn className="btn ghost-p icon" tweaks={t}>×</Btn>
        <Btn className="btn cyan icon" tweaks={t}>▓</Btn>
        <Btn className="btn ghost dis" tweaks={t}>OFFLINE</Btn>
      </div>
      <div className="label">// CHECKER ACCENT</div>
      <div className="row">
        <Btn className="btn chk" style={{ color: '#fff', border: '1px solid #fff', textShadow: '0 0 4px #000,0 1px 2px #000' }} tweaks={t}>▦ ENGAGE</Btn>
        <button
          className="btn"
          style={{ ...GEOMETRY_STYLE[t.geometry], filter: signalFilter(t.signal), background: '#000', color: '#fff', border: '1px solid #fff', gap: 0, padding: 0 }}
        >
          <span className="chk" style={{ width: 18, height: 32, display: 'inline-block' }}></span>
          <span style={{ padding: '0 14px' }}>SYNC</span>
        </button>
      </div>
      <TweaksPanel>
        <TweakSection label="Feel" />
        <TweakRadio label="Signal" value={t.signal} options={['live', 'standby', 'offline']} onChange={(v) => setTweak('signal', v)} />
        <TweakRadio label="Geometry" value={t.geometry} options={['sharp', 'notched', 'pill']} onChange={(v) => setTweak('geometry', v)} />
        <TweakRadio label="Glitch" value={t.glitch} options={['off', 'subtle', 'heavy']} onChange={(v) => setTweak('glitch', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="../glitch.js"></script>
</body></html>
