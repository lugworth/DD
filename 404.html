<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // Signal Lost — digidelic</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Geist Mono';
      src: url('/fonts/GeistMono-VariableFont_wght.ttf') format('truetype-variations');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --black: #000000;
      --panel: #111110;
      --blue: #2d6cff;
      --pink: #ff2d87;
      --cyan: #00d9ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--black);
      color: #ffffff;
      font-family: 'Geist Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .dd-card {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 45, 135, 0.25);
      max-width: 440px;
      width: 100%;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .dd-tag {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--pink);
      font-weight: 700;
    }
    .dd-code {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 54px;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1;
      font-weight: 700;
    }
    .dd-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.5;
      letter-spacing: 0.04em;
    }
    .dd-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--blue);
      color: #ffffff;
      border: 1px solid var(--blue);
      padding: 10px 20px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 120ms ease;
    }
    .dd-btn:hover {
      background: var(--pink);
      border-color: var(--pink);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="dd-card" id="not-found-card">
    <span class="dd-tag">// 404 ERROR //</span>
    <h1 class="dd-code">404</h1>
    <p class="dd-sub">Signal lost. The requested instrument or component node could not be localized on the grid.</p>
    <a href="/tools" class="dd-btn" id="back-to-rack-btn">
      <span>← RETURN TO TOOLS RACK</span>
    </a>
  </div>
  <script src="/nav-node.js" defer></script>
</body>
</html>
