<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="styles.css"><style>
@font-face{font-family:'Geist Mono';src:url('fonts/GeistMono-VariableFont_wght.ttf') format('truetype-variations');font-weight:100 900;font-style:normal;font-display:swap}
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;background:#080808;display:flex;align-items:center;justify-content:center;gap:36px}

.side{font-family:'Geist Mono',monospace;font-size:34px;line-height:1.5;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.1em}
.side b{color:#00d9ff;font-weight:400;display:block;font-size:26px;margin-top:4px}
.strip{width:320px;height:854px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head><body>
<div class="main"><div class="tile">d</div><div class="side">DIGIDELIC<b>lugworth.design</b></div></div>
